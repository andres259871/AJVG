<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Escribir</title>
<meta name="robots" content="noindex, nofollow" />

<meta name="theme-color" content="#0f1726" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Escribir" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="favicon-32.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<main class="admin-wrap">

  <section id="loginView">
    <p class="kicker">Entrar</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="correo" autocomplete="username" required />
      <input type="password" id="password" placeholder="contraseña" autocomplete="current-password" required />
      <button type="submit">Entrar</button>
    </form>
    <p id="loginError" class="admin-error" hidden></p>
  </section>

  <section id="writeView" hidden>
    <p class="kicker">Escribirle</p>
    <form class="compose" id="writeForm">
      <div class="attach-preview" id="attachPreview" hidden>
        <img id="attachImg" alt="" hidden />
        <audio id="attachAudio" controls hidden></audio>
        <button type="button" class="attach-discard" id="attachDiscard" aria-label="Descartar adjunto">✕</button>
      </div>

      <textarea id="text" maxlength="400" placeholder="Escribe aquí…"></textarea>
      <p class="admin-count"><span id="count">0</span>/400</p>

      <div class="compose-tools">
        <button type="button" class="tool-btn" id="photoBtn" aria-label="Adjuntar foto">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />

        <button type="button" class="tool-btn" id="micBtn" aria-label="Grabar audio">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <span class="rec-indicator" id="recIndicator" hidden>● <span id="recTime">0:00</span></span>

        <button type="submit" id="sendBtn">Enviar</button>
      </div>

      <p id="sendStatus" class="admin-status" hidden></p>
    </form>

    <div class="admin-last">
      <p class="admin-last-label">Último mensaje enviado</p>
      <div id="lastMessage" class="admin-last-content">—</div>
    </div>

    <div class="admin-last">
      <p class="admin-last-label">Último mensaje de Anne</p>
      <div id="anneLastMessage" class="admin-last-content">—</div>
    </div>

    <button id="logoutBtn" class="admin-logout" type="button">Cerrar sesión</button>
  </section>

</main>

<script type="module" src="admin.js"></script>
</body>
</html>
