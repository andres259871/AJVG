<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>31 de diciembre</title>

<meta name="theme-color" content="#0f1726" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="31 dic" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="manifest" href="manifest.json" />

<meta name="description" content="Cuenta regresiva hasta el 31 de diciembre." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<canvas id="sky"></canvas>

<main class="wrap">
  <p class="kicker" id="kicker">Faltan</p>

  <div class="clock" id="clock" aria-live="polite">
    <div class="unit">
      <span class="num" id="d">00</span>
      <span class="label">días</span>
    </div>
    <div class="colon">·</div>
    <div class="unit">
      <span class="num" id="h">00</span>
      <span class="label">horas</span>
    </div>
    <div class="colon">·</div>
    <div class="unit">
      <span class="num" id="m">00</span>
      <span class="label">min</span>
    </div>
    <div class="colon">·</div>
    <div class="unit">
      <span class="num" id="s">00</span>
      <span class="label">seg</span>
    </div>
  </div>

  <p class="target">31 de diciembre, 2026 · Madrid</p>

  <p class="message" id="message"></p>

  <p class="done-message" id="doneMessage" hidden></p>

  <section class="thread" aria-label="Mensajes">
    <div class="thread-col">
      <p class="thread-label">Andrés</p>
      <div class="thread-list" id="andresList">
        <p class="thread-empty">Todavía nada por aquí.</p>
      </div>
    </div>
    <div class="thread-col">
      <p class="thread-label">Anne</p>
      <div class="thread-list" id="anneList">
        <p class="thread-empty">Todavía nada por aquí.</p>
      </div>
    </div>
  </section>

  <form class="compose" id="composeForm">
    <div class="attach-preview" id="attachPreview" hidden>
      <img id="attachImg" alt="" hidden />
      <audio id="attachAudio" controls hidden></audio>
      <button type="button" class="attach-discard" id="attachDiscard" aria-label="Descartar adjunto">✕</button>
    </div>

    <textarea id="composeText" maxlength="500" placeholder="Escríbele algo a Andrés…"></textarea>

    <div class="compose-tools">
      <button type="button" class="tool-btn" id="photoBtn" aria-label="Adjuntar foto">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden />

      <button type="button" class="tool-btn" id="micBtn" aria-label="Grabar audio">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <span class="rec-indicator" id="recIndicator" hidden>● <span id="recTime">0:00</span></span>

      <button type="submit" id="composeBtn" disabled>Enviar</button>
    </div>

    <p class="compose-status" id="composeStatus" hidden></p>
  </form>
</main>

<script src="script.js"></script>
<script type="module" src="live.js"></script>
</body>
</html>
